<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Nova | Uniandes</title>
    <style>
        :root { --primary: #2D5A27; --accent: #FFD700; --bg: #f4f7f4; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h1 { color: var(--primary); margin: 0; }
        
        .score-badge { background: var(--accent); padding: 8px 20px; border-radius: 50px; font-weight: bold; display: inline-block; margin: 15px 0; border: 2px solid #555; }
        
        #webcam-container { width: 300px; height: 300px; margin: 0 auto 1.5rem; border: 5px solid var(--primary); border-radius: 20px; overflow: hidden; background: #000; }
        
        #recommendation-box { padding: 20px; border-radius: 15px; font-weight: bold; font-size: 1.3rem; min-height: 3rem; display: flex; align-items: center; justify-content: center; background: #eee; border: 2px solid #ccc; transition: 0.3s; }
        
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌿 Terra Nova</h1>
        <div class="score-badge">Puntos: <span id="puntos-val">0</span></div>
        
        <button type="button" id="btn-start" onclick="init()">ENCENDER CÁMARA</button>
        
        <div id="webcam-container"></div>

        <div id="recommendation-box">
            <span id="caneca-tipo">ESPERANDO...</span>
        </div>
        
        <p id="status" style="font-size: 0.8rem; color: #888; margin-top: 15px;">Apunta a un residuo para sumar +10 pts</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script type="text/javascript">
        // Configuración Firebase (Uniandes)
        const firebaseConfig = {
            apiKey: "AIzaSyBkhSSJf--g82qC5JzJ6Eo8T2TndoZG2XY",
            authDomain: "eas---terranova.firebaseapp.com",
            projectId: "eas---terranova",
            storageBucket: "eas---terranova.firebasestorage.app",
            messagingSenderId: "278692618578",
            appId: "1:278692618578:web:804363f773a2cc6f349a8b"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const URL = "https://teachablemachine.withgoogle.com/models/0HJIR3EIH/";
        let model, webcam, maxPredictions, puntos;
        let puedeSumar = true; // Control para no sumar mil puntos por segundo

        puntos = parseInt(localStorage.getItem('terra_pts_v6')) || 0;
        document.getElementById("puntos-val").innerText = puntos;

        async function init() {
            document.getElementById('btn-start').style.display = "none";
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(300, 300, false);
            await webcam.setup();
            await webcam.play();
            
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            window.requestAnimationFrame(loop);
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let top = { className: "", probability: 0 };

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > top.probability) {
                    top = prediction[i];
                }
            }

            actualizarInterfaz(top.className, top.probability);
        }

        function actualizarInterfaz(clase, prob) {
            const box = document.getElementById("recommendation-box");
            const texto = document.getElementById("caneca-tipo");

            if (clase === "Aprovechables") {
                texto.innerText = "⬜ CANECA BLANCA";
                box.style.background = "#fff"; box.style.color = "#222";
                if (prob > 0.90) sumarPuntos(clase);
            } 
            else if (clase === "No aprovechables") {
                texto.innerText = "⬛ CANECA NEGRA";
                box.style.background = "#333"; box.style.color = "#fff";
                if (prob > 0.90) sumarPuntos(clase);
            } 
            else if (clase === "Orgánicos") {
                texto.innerText = "🟩 CANECA VERDE";
                box.style.background = "#2D5A27"; box.style.color = "#fff";
                if (prob > 0.90) sumarPuntos(clase);
            } 
            else {
                texto.innerText = "❌ DESCONOCIDO";
                box.style.background = "#d93025"; box.style.color = "#fff";
            }
        }

        function sumarPuntos(clase) {
            if (!puedeSumar) return;
            
            puedeSumar = false;
            puntos += 10;
            localStorage.setItem('terra_pts_v6', puntos);
            document.getElementById("puntos-val").innerText = puntos;
            
            // Guardar en Firebase
            db.collection("ranking").add({ residuo: clase, fecha: new Date(), puntos: 10 });

            // Bloqueo de 3 segundos para que no sume puntos infinitos con el mismo objeto
            setTimeout(() => { puedeSumar = true; }, 3000);
        }
    </script>
</body>
</html>
