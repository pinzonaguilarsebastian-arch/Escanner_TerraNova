<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        :root { --primary: #2D5A27; --accent: #FFD700; --bg: #f4f7f4; --dark: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: var(--dark); text-align: center; }
        
        /* Sistema de Navegación */
        .view { display: none; padding: 20px; flex-direction: column; align-items: center; min-height: 100vh; }
        .active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Componentes de UI */
        .menu-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 85%; max-width: 350px; margin: 15px 0; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .menu-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px 25px; border-radius: 10px; font-weight: bold; width: 250px; margin: 10px; cursor: pointer; }
        .score-badge { background: var(--accent); padding: 10px 25px; border-radius: 50px; font-weight: bold; font-size: 1.5rem; margin: 20px; border: 2px solid #555; }

        /* Contenedores de Cámara e Imagen */
        #webcam-container, #preview-container { width: 300px; height: 300px; border: 5px solid var(--primary); border-radius: 20px; background: #000; overflow: hidden; margin: 20px 0; position: relative; }
        #img-preview { width: 100%; height: 100%; object-fit: cover; }
        #res-label { font-size: 1.4rem; font-weight: bold; min-height: 3em; padding: 10px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
