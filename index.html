<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terra Nova Debug</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f4f0; }
        #webcam-container { margin: 10px auto; width: 300px; height: 300px; border: 3px solid #2D5A27; background: #000; }
        button { padding: 20px; font-weight: bold; cursor: pointer; background: #FFD700; border: none; border-radius: 10px; font-size: 18px; }
        #label-container { margin-top: 15px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🌿 Escáner Terra Nova</h1>
    <p id="status">Esperando conexión con Google...</p>
    <button type="button" onclick="init()">Cargar y Abrir Cámara</button>
    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/YTyc-7h11/";
        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            try {
                document.getElementById('status').innerText = "Cargando modelo...";
                
                // Verificación técnica de seguridad
                if (typeof tmImage === 'undefined') {
                    throw new Error("Librería tmImage no cargada. Revisa tu internet.");
                }

                model = await tmImage.load(URL + "model.json", URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                document.getElementById('status').innerText = "Iniciando cámara...";
                webcam = new tmImage.Webcam(300, 300, true); 
                
                await webcam.setup(); 
                await webcam.play();
                
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                document.getElementById('status').innerText = "✅ Escáner en línea";
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "❌ ERROR: " + err.message;
                alert("Hubo un problema: " + err.message);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction = prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
