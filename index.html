<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Nova App</title>
    <style>
        :root { --primary: #2D5A27; --accent: #FFD700; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f0; margin: 0; text-align: center; }
        
        /* Contenedores de Pantallas */
        .view { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Botones y Estilo */
        .btn-menu { background: var(--primary); color: white; border: none; padding: 20px; margin: 10px; border-radius: 15px; width: 80%; max-width: 300px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .btn-back { background: #666; color: white; border: none; padding: 10px; border-radius: 8px; margin-bottom: 20px; cursor: pointer; }
        
        #webcam-container, #preview-container { margin: 15px auto; width: 300px; height: 300px; border: 4px solid var(--primary); border-radius: 15px; background: #000; overflow: hidden; }
        .score-badge { background: var(--accent); padding: 10px 20px; border-radius: 50px; font-weight: bold; display: inline-block; margin: 10px; }
        #res-label { font-size: 1.5rem; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="view-inicio" class="view active">
        <br><h1>🌿 Terra Nova</h1>
        <p>¿Qué quieres hacer hoy?</p>
        <button class="btn-menu" onclick="showView('view-escaner', true)">🔍 ESCÁNER RÁPIDO<br><small>Saber dónde va el residuo</small></button>
        <button class="btn-menu" onclick="showView('view-puntos')">🏆 SUBIR EVIDENCIA<br><small>Sumar puntos en Firebase</small></button>
    </div>

    <div id="view-escaner" class="view">
        <button class="btn-back" onclick="stopWebcam()">⬅ Volver</button>
        <h2>Escáner en Vivo</h2>
        <div id="webcam-container"></div>
        <div id="res-label">Iniciando...</div>
    </div>

    <div id="view-puntos" class="view">
        <button class="btn-back" onclick="showView('view-inicio')">⬅ Volver</button>
        <div class="score-badge">Tus Puntos: <span id="puntos-val">0</span></div>
        <h2>Sube tu Evidencia</h2>
        <input type="file" id="file-input" accept="image/*" onchange="previewImg(this)" style="display:none">
        <button class="btn-menu" onclick="document.getElementById('file-input').click()">📸 TOMAR/SUBIR FOTO</button>
        <div id="preview-container"><img id="img-preview" style="width:100%; display:none"></div>
        <button id="btn-validate" class="btn-menu" style="background:var(--accent); color:black; display:none" onclick="validarEvidencia()">VALIDAR Y SUMAR +10</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBkhSSJf--g82qC5JzJ6Eo8T2TndoZG2XY",
            authDomain: "eas---terranova.firebaseapp.com",
            projectId: "eas---terranova",
            storageBucket: "eas---terranova.firebasestorage.app",
            messagingSenderId: "278692618578",
            appId: "1:278692618578:web:804363f773a2cc6f349a8b",
            measurementId: "G-7P9CTHC8E4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const URL = "https://teachablemachine.withgoogle.com/models/YTyc-7h11/";
        let model, webcam, puntos = 0;

        async function initIA() {
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        }
        initIA();

        // Navegación
        function showView(viewId, startCam = false) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (startCam) initWebcam();
        }

        // Lógica de Cámara (Escáner Libre)
        async function initWebcam() {
            webcam = new tmImage.Webcam(300, 300, false);
            await webcam.setup();
            await webcam.play();
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            window.requestAnimationFrame(updateCam);
        }

        async function updateCam() {
            if (webcam && webcam.canvas) {
                webcam.update();
                const prediction = await model.predict(webcam.canvas);
                let top = { className: "", probability: 0 };
                prediction.forEach(p => { if(p.probability > top.probability) top = p; });
                
                const label = document.getElementById("res-label");
                label.innerText = top.className + " (" + (top.probability * 100).toFixed(0) + "%)";
                label.style.color = top.className === "Orgánicos" ? "green" : (top.className === "Aprovechables" ? "blue" : "black");
                
                window.requestAnimationFrame(updateCam);
            }
        }

        function stopWebcam() {
            if (webcam) { webcam.stop(); webcam = null; }
            showView('view-inicio');
        }

        // Lógica de Puntos (Evidencia)
        function previewImg(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById("img-preview");
                    img.src = e.target.result;
                    img.style.display = "block";
                    document.getElementById("btn-validate").style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        }

        async function validarEvidencia() {
            const img = document.getElementById("img-preview");
            const prediction = await model.predict(img);
            let top = { className: "", probability: 0 };
            prediction.forEach(p => { if(p.probability > top.probability) top = p; });

            if (top.probability > 0.7) {
                puntos += 10;
                document.getElementById("puntos-val").innerText = puntos;
                db.collection("ranking").add({ residuo: top.className, pts: 10, fecha: new Date() });
                alert("¡Puntos guardados en Firebase! Detectado: " + top.className);
                showView('view-inicio');
            } else {
                alert("La IA no está segura. Intenta otra foto.");
            }
        }
    </script>
</body>
</html>
